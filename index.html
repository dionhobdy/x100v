<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Simulation</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <div class="container">
        <div class="camera-section">
            <video id="video" playsinline autoplay></video>
            <canvas id="canvas"></canvas>
            <div id="capturePreview">
                <div class="preview-container">
                    <img id="previewImg">
                    <div class="preview-buttons">
                        <button id="deleteBtn"><img src="./assets/delete.png" alt="Delete"/></button>
                        <button id="downloadBtn"><img src="./assets/download.png" alt="Download"/></button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="settings-toggle">
            <h3>Settings</h3>
        </div>

        <button id="captureBtn"><img src="./assets/capture.png"/></button>
        
        <div class="controls">
            <div class="settings-content collapsed">
                <div class="control-group">
                    <label for="zoom">Zoom: <span id="zoomValue">1.0x</span></label>
                    <input type="range" id="zoom" min="1" max="4" step="0.1" value="1">
                    <p class="info-text" id="focusStatus" aria-live="polite">Tap the preview to focus.</p>
                </div>

                <div class="control-group">
                    <label>Device Camera</label>
                    <select id="cameraSelect">
                        <option value="environment">Rear Camera</option>
                        <option value="user">Front Camera</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Camera Simulation</label>
                    <div class="preset-buttons">
                        <button class="preset-btn active" data-preset="x100v">Fujifilm X100V</button>
                        <button class="preset-btn" data-preset="gameboy">Gameboy Camera</button>
                        <button class="preset-btn" data-preset="tx20">Sony Cyber-shot DSC-TX20</button>
                        <button class="preset-btn" data-preset="polaroid-now">Polaroid Now / Now+</button>
                        <button class="preset-btn" data-preset="polaroid-onestep">Polaroid OneStep 2 / 2+</button>
                        <button class="preset-btn" data-preset="a6400">Sony Alpha a6400</button>
                        <button class="preset-btn" data-preset="zv1f">Sony ZV-1F</button>
                    </div>
                </div>

                <div class="control-group">
                    <label for="lensSelect">Lens</label>
                    <select id="lensSelect">
                        <option value="standard">Standard</option>
                        <option value="retropia">Retropia</option>
                        <option value="fisheye">Fisheye</option>
                    </select>
                </div>

                <div class="control-group">
                    <label id="cameraSettingLabel" for="cameraSetting">Film Simulation</label>
                    <select id="cameraSetting"></select>
                </div>

                <div id="cameraControls" aria-live="polite"></div>
            </div>
        </div>
    </div>
    <script src="./scripts/camera.js"></script>
</body>
</html>
